openapi: 3.0.3
# ---------------------------------------------------------------------------
# STEP 1 — Service semantics as an OpenAPI document.
#
# Edit this file in the Swagger Editor (/editor once the server runs, or
# https://editor.swagger.io) and fix every warning. Then `make gen-rest`.
#
# This file describes the running EXAMPLE, a key-value store. Students do
# not implement it: replace it with your own service, keeping the structure:
#   * every operation has an operationId  -> becomes a Go method name
#   * reusable pieces live in components (schemas, parameters, responses)
#   * reads take a `consistency` query parameter
#   * errors are application/problem+json (RFC 9457)
# ---------------------------------------------------------------------------
info:
  title: Simple To-Do list
  version: 1.0.0
  description: |
    Client-facing RESTful API of the Simple To-Do list.

    * Reads accept `?consistency=sequential|linearizable` (default: sequential).
      All writes are linearizable.
    * Every entry has a `version`; `GET /v1/keys/{key}` returns it as the
      `ETag`. Send it back in `If-Match` to write only if nothing changed in
      between (412 otherwise).
    * **POST** sets values. **PATCH** modifies them with a read-modify-write
      operation (`append` or `increment`).
servers:
  - url: /
    description: The server that serves this page (use with /docs)
  - url: http://localhost:8080
    description: Node n1 (from Swagger Editor/UI containers; needs -cors-origin)
tags:
  - name: tasks
    description: Several tasks at once (atomic)
  - name: task
    description: One task

paths:
  /v1/tasks:
    get:
      tags: [tasks]
      operationId: getTasks
      summary: Read several tasks, sorted by task ID
      description: |
        Select tasks with at most one of `task` (repeatable), `prefix`, or
        `from`/`to` (range [from, to)). No selector = all keys.
        Missing tasks are skipped.
      parameters:
        - name: task
          in: query
          required: false
          description: Repeat for several tasks (?task=a&task=b)
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: prefix
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string }
        - name: to
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Sort'
        - name: limit
          in: query
          required: false
          description: Maximum number of entries (0 or absent = no limit)
          schema: { type: integer, format: int32, minimum: 0 }
        - name: tasksOnly
          in: query
          required: false
          description: Return only the tasks (values empty)
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The entries, in sort order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryList' }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      operationId: setTasks
      summary: Set several tasks atomically
      description: All or nothing. 412 if any `ifVersion` differs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTasksBody' }
      responses:
        '200':
          description: The entries after the write, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryList' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tasks]
      operationId: modifyTasks
      summary: Append to or increment several keys atomically (read-modify-write)
      description: All or nothing. 412 if any `ifVersion` differs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyTasksBody' }
      responses:
        '200':
          description: The entries after the operation, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryList' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      operationId: deleteTasks
      summary: Delete several tasks atomically
      parameters:
        - name: key
          in: query
          required: true
          description: Repeat for several tasks (?task=a&task=b)
          schema:
            type: array
            items: { type: string }
            minItems: 1
          style: form
          explode: true
      responses:
        '200':
          description: How many of the tasks existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/keys/{task}:
    parameters:
      - $ref: '#/components/parameters/Task'
    get:
      tags: [task]
      operationId: getTask
      summary: Read one task
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The entry
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [task]
      operationId: setTask
      summary: Set one task (create or replace)
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetBody' }
      responses:
        '200':
          description: Replaced; the entry after the write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '201':
          description: Created; the new entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [task]
      operationId: modifyTask
      summary: Append to or increment one task (read-modify-write)
      description: |
        Give exactly one of `append` (missing task = "") or `increment`
        (missing task = 0; the value must be an integer).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyBody' }
      responses:
        '200':
          description: The entry after the operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [task]
      operationId: deleteTask
      summary: Delete one task
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted (also returned if the task did not exist)
        '412': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    Task:
      name: task
      in: path
      required: true
      schema: { type: string }
    Consistency:
      name: consistency
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Consistency' }
    Sort:
      name: sort
      in: query
      required: false
      description: Sort field; prefix `-` for descending. Ties break by task.
      schema:
        type: string
        enum: [task, -task, value, -value, version, -version]
        default: task
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Write only if the entry's ETag (version) equals this
      schema: { type: string }

  headers:
    ETag:
      description: The entry's version, quoted (e.g. "3")
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Consistency:
      type: string
      enum: [sequential, linearizable]
      default: sequential

    Entry:
      type: object
      required: [task, value, version]
      properties:
        key: { type: string }
        value: { type: string }
        version:
          type: integer
          format: int64
          description: Incremented on every write of this task

    EntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }

    SetBody:
      type: object
      required: [value]
      properties:
        value: { type: string }

    ModifyBody:
      type: object
      description: Exactly one of `append`
      properties:
        append: { type: string }

    SetTasksBody:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [task, value]
            properties:
              task: { type: string }
              value: { type: string }
              ifVersion:
                type: integer
                format: int64
                description: Write only if the version equals this (0 = must not exist)

    ModifyTasksBody:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          items:
            type: object
            required: [task]
            description: Exactly one of `append` or `increment`
            properties:
              task: { type: string }
              append: { type: string }
              increment: { type: integer, format: int64 }
              ifVersion:
                type: integer
                format: int64

    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int32

    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string, description: 'Short summary, e.g. "Not Found"' }
        status: { type: integer, description: "The HTTP status code" }
        detail: { type: string, description: "What went wrong in this case" }
