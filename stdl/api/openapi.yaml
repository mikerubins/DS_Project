openapi: 3.0.3
# ---------------------------------------------------------------------------
# STEP 1 — Service semantics as an OpenAPI document.
#
# Edit this file in the Swagger Editor (/editor once the server runs, or
# https://editor.swagger.io) and fix every warning. Then `make gen-rest`.
#
# This file describes the running EXAMPLE, a key-value store. Students do
# not implement it: replace it with your own service, keeping the structure:
#   * every operation has an operationId  -> becomes a Go method name
#   * reusable pieces live in components (schemas, parameters, responses)
#   * reads take a `consistency` query parameter
#   * errors are application/problem+json (RFC 9457)
# ---------------------------------------------------------------------------
info:
  title: Simple To-Do list
  version: 1.0.0
  description: |
    Client-facing RESTful API of the Simple To-Do list.

    * Reads accept `?consistency=sequential|linearizable` (default: sequential).
      All writes are linearizable.
    * Every entry has a `version`; `GET /v1/tasks/{task}` returns it as the
      `ETag`. Send it back in `If-Match` to write only if nothing changed in
      between (412 otherwise).
    * **POST** creates or replaces task bodies.
    * **PATCH** modifies task bodies or appends participants.
    * Filters can be combined: tasks matching all supplied filters are returned.
servers:
  - url: /
    description: The server that serves this page (use with /docs)
  - url: http://localhost:8080
    description: Node n1 (from Swagger Editor/UI containers; needs -cors-origin)
tags:
  - name: tasks
    description: Several tasks at once (atomic)
  - name: task
    description: One task

paths:
  /v1/tasks:
    get:
      tags: [tasks]
      operationId: getTasks
      summary: Read several tasks, sorted by task ID
      description: |
        Read all tasks or select a task list by task IDs, participants, priorities,
        completion state, prefix, or the half-open range `[from, to)`.
        Supplied filters are intersected. Missing task IDs are skipped.
        Use `limit` to cap the response and `tasksOnly` to omit each entry body.
      parameters:
        - name: task
          in: query
          required: false
          description: Repeat for several tasks (?task=a&task=b)
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: participant
          in: query
          required: false
          description: Repeat for several participants (?participant=a&participant=b)
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: priority
          in: query
          required: false
          description: Reapeat for several priorities in the range [1,5] (?priority=a&priority=b)
          schema:
            type: array
            items: { type: integer, format: int32, minimum: 1, maximum: 5}
        - name: prefix
          in: query
          required: false
          schema: { type: string }
        - name: from
          in: query
          required: false
          schema: { type: string }
        - name: to
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Sort'
        - name: byCompleted
          in: query
          required: false
          description: Filter completed tasks
          schema: { type: boolean }
        - name: byOpen
          in: query
          required: false
          description: Filter open tasks
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          description: Maximum number of entries (0 or absent = no limit)
          schema: { type: integer, format: int32, minimum: 0 }
        - name: tasksOnly
          in: query
          required: false
          description: Return only the tasks (values empty)
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The entries, in sort order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryList' }
        '400': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      operationId: setTasks
      summary: Set several tasks atomically
      description: |
        Create or replace multiple tasks in one atomic operation.
        The whole batch succeeds only if every optional `ifVersion` matches.
        Returns `412` if any compare-and-set version differs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTasksBody' }
      responses:
        '200':
          description: The entries after the write, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryList' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tasks]
      operationId: modifyTasks
      summary: Modify several tasks atomically
      description: |
        Modify, append participants to, or increment the version of multiple tasks
        in one atomic operation. Exactly one mutation action is allowed per task.
        Returns `412` if any compare-and-set version differs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyTasksBody' }
      responses:
        '200':
          description: The entries after the operation, in request order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryList' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [tasks]
      operationId: deleteTasks
      summary: Delete several tasks atomically
      description: Delete every supplied task in one operation. Missing tasks are ignored.
      parameters:
        - name: task
          in: query
          required: true
          description: Repeat for several tasks (?task=a&task=b)
          schema:
            type: array
            items: { type: string }
            minItems: 1
          style: form
          explode: true
      responses:
        '200':
          description: How many of the tasks existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteResult' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/tasks/{task}:
    parameters:
      - $ref: '#/components/parameters/Task'
    get:
      tags: [task]
      operationId: getTask
      summary: Read one task
      description: |
        Return one task and its current entry body.
        The response `ETag` contains the task version for use in `If-Match`.
      parameters:
        - $ref: '#/components/parameters/Consistency'
      responses:
        '200':
          description: The entry
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [task]
      operationId: setTask
      summary: Set one task (create or replace)
      description: |
        Create a task with status `201`, or replace an existing task with status
        `200`. A mismatched `If-Match` value returns `412`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetBody' }
      responses:
        '200':
          description: Replaced; the entry after the write
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '201':
          description: Created; the new entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [task]
      operationId: modifyTask
      summary: Modify one task
      description: |
        Apply exactly one mutation: `modifyFields`, `appendParticipants`,
        or `incrementVersion`. A mismatched `If-Match` value returns `412`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModifyBody' }
      responses:
        '200':
          description: The entry after the operation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Entry' }
        '400': { $ref: '#/components/responses/Problem' }
        '412': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [task]
      operationId: deleteTask
      summary: Delete one task
      description: |
        Delete the task. Missing tasks are successful no-ops; a mismatched
        `If-Match` version returns `412`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted (also returned if the task did not exist)
        '412': { $ref: '#/components/responses/Problem' }

components:
  parameters:
    Task:
      name: task
      in: path
      required: true
      description: Unique task identifier.
      schema: { type: string }
    Consistency:
      name: consistency
      in: query
      required: false
      description: Read consistency. Defaults to sequential.
      schema: { $ref: '#/components/schemas/Consistency' }
    Sort:
      name: sort
      in: query
      required: false
      description: Sort field; prefix `-` for descending. Ties break by task.
      schema:
        type: string
        enum: [task, -task, version, -version, priority, -priority]
        default: task
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Write only if the entry's ETag (version) equals this
      schema: { type: string }

  headers:
    ETag:
      description: The entry's version, quoted (e.g. "3")
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Consistency:
      type: string
      enum: [sequential, linearizable]
      default: sequential
      description: Sequential or linearizable read consistency.

    Entry:
      type: object
      required: [task, entryBody]
      description: A task identifier and its complete task body.
      properties:
        task:
          type: string
          description: Unique task identifier.
        entryBody:
          $ref: '#/components/schemas/EntryBody'

    EntryBody:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        participants:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 5
        priority:
          type: integer
          format: int32
          minimum: 1
          maximum: 5
          description: Indicates a priority level for the task in the range [1,5], with 1 as highest
        completed:
          type: boolean
          default: false
          description: Indicates if the task is completed (true) or not (false)
        version:
          type: integer
          format: int64
          description: Incremented on every write of this task
      description: Schema of the task body

    ModifyAction:
      type: object
      description: |
        Selects individual mutable fields and supplies replacement values.
        Each mutable flag applies only to the corresponding field.
      properties:
        nameMutable:
            type: boolean
            default: false
        descriptionMutable:
            type: boolean
            default: false
        participantsMutable:
            type: boolean
            default: false
        priorityMutable:
            type: boolean
            default: false
        completedMutable:
            type: boolean
            default: false
        versionMutable:
            type: boolean
            default: false
        appendParticipants:
            type: boolean
            default: false
        entryBody: { $ref: '#/components/schemas/EntryBody' }

    AppendAction:
      type: object
      description: Append participants without removing existing participants.
      properties:
        participants:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string }

    EntryMutables:
      type: object
      description: Exactly one of modifyFields, appendParticipants, or incrementVersion
      properties:
        modifyFields:
          $ref: '#/components/schemas/ModifyAction'
        appendParticipants:
          $ref: '#/components/schemas/AppendAction'
        incrementVersion:
          type: boolean
          description: Set to true to increment the task version.

    EntryList:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }

    SetBody:
      type: object
      required: [entryBody]
      description: Complete task body for a create-or-replace operation.
      properties:
        entryBody:
          $ref: '#/components/schemas/EntryBody'

    ModifyBody:
      type: object
      required: [entryMutables]
      description: Exactly one mutation to apply to one task.
      properties:
        entryMutables:
          $ref: '#/components/schemas/EntryMutables'

    SetTasksBody:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          minItems: 1
          items:
            type: object
            required: [task, entryBody]
            properties:
              task: { type: string }
              entryBody: { $ref: '#/components/schemas/EntryBody' }
              ifVersion:
                type: integer
                format: int64
                description: Write only if the version equals this (0 = must not exist)

    ModifyTasksBody:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          items:
            type: object
            required: [task, entryMutables]
            description: Exactly one of `append`, `modify` or `increment`
            properties:
              task: { type: string }
              entryMutables: { $ref: '#/components/schemas/EntryMutables' }
              ifVersion:
                type: integer
                format: int64

    DeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int32

    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string, default: "about:blank" }
        title: { type: string, description: 'Short summary, e.g. "Not Found"' }
        status: { type: integer, description: "The HTTP status code" }
        detail: { type: string, description: "What went wrong in this case" }
