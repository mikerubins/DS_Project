// STEPS 3-4 — The internal gRPC service (compile with `make gen-proto`).
//
// This is the running EXAMPLE (a key-value store); replace it with your own
// service. Rules shown here:
//   * every RPC has its OWN request and response message
//   * streams carry a variable number of items (keys, entries)
//   * errors are gRPC status codes, not fields in the messages
//   * RPCs need not map 1:1 to REST operations (8 REST operations, 3 RPCs)
syntax = "proto3";
package stdl.v1;
option go_package = "github.com/mikerubins/DS_Project/stdl/gen/stdl/v1;stdlv1";

service STDList {
  // One task, a list, a prefix or a range; results stream back sorted.
  // NOT_FOUND only when a single task was asked for and it is missing.
  rpc Read(ReadRequest) returns (stream ReadResponse);
  // One UpdateRequest per task; all are applied atomically when the client
  // closes the stream. FAILED_PRECONDITION if any if_version differs.
  rpc Update(stream UpdateRequest) returns (UpdateResponse);
  // One DeleteRequest per task; applied atomically on close.
  rpc Delete(stream DeleteRequest) returns (DeleteResponse);
  // Not in Part I:
  // rpc Watch(WatchRequest) returns (stream WatchResponse);
}

enum Consistency {
  CONSISTENCY_UNSPECIFIED = 0;  // treated as SEQUENTIAL
  CONSISTENCY_SEQUENTIAL = 1;
  CONSISTENCY_LINEARIZABLE = 2;
}

message EntryBody {
    string name = 1;
    string description = 2;
    repeated string participants = 3;
    int32 priority = 4;
    bool completed = 5;
    int64 version = 6;          // incremented on every write of this key
}

message Entry {
  string task = 1;
  EntryBody entryBody = 2;
}

message ModifyAction {
    bool nameMutable = 1;
    bool descriptionMutable = 2;
    bool participantsMutable = 3;
    bool priorityMutable = 4;
    bool completedMutable = 5;
    bool versionMutable = 6;
    bool appendParticipants = 7;
    EntryBody entryBody = 8;
}

message AppendAction {
    repeated string participants = 1;
}

// Enforces: Exactly one of `modify`, `append`, or `increment version`
message EntryMutables {
  oneof action {
    ModifyAction modifyFields = 1;
    AppendAction appendParticipants = 2;
    bool incrementVersion = 3;
  }
}

// ---- Read --------------------------------------------------------------
message ReadOneRequest {
    string task = 1;
}

message ReadMultipleRequests {
    repeated string tasks = 1; // task number filter
    repeated string participants = 2; // task participants filter
    repeated string priorities = 3; // task priorities filter
    bool completed = 4; // task completed filter
    string prefix = 5; // task prefix filter
    TaskRange range = 6; // task range filter [from, to)
    SortOrder sort = 7;
    int32 limit = 8;              // 0 = no limit
    bool tasks_only = 9;           // entries carry only the task
    Consistency consistency = 10;
}

message ReadRequest {
  oneof select {
    ReadOneRequest oneRequest = 1; // read only one request
    ReadMultipleRequests multipleRequests = 2; // read multiple requests
  }
}
message TaskList  { repeated string tasks = 1; }
message TaskRange { string from = 1; string to = 2; }  // empty = unbounded
message SortOrder {
  enum Field { FIELD_TASK = 0; FIELD_VERSION = 1; FIELD_PRIORITY = 2; }
  Field field = 1;
  bool descending = 2;          // ties are always broken by task, ascending
}
message ReadResponse {
  Entry entry = 1;              // one message per entry, in sort order
}

// ---- Update ------------------------------------------------------------
message UpdateRequest {
  string task = 1;
  oneof op {
    EntryBody entryBody = 2;             // create or replace the value
    EntryMutables entryMutable = 3;       // modify fields
  }
  optional int64 if_version = 4; // CAS; 0 = task must not exist
}
message UpdateResponse {
  repeated Entry entries = 1;   // entries after the update, request order
  repeated bool created = 2;    // per entry: did the key exist before?
}

// ---- Delete ------------------------------------------------------------
message DeleteRequest {
  string task = 1;
  optional int64 if_version = 2;
}
message DeleteResponse {
  int32 deleted = 1;            // keys that existed (missing: no error)
}

